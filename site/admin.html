<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloom & Cacao — admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Jost:wght@400;500&display=swap">
<style>
:root{--g:#e6c277;--em:#0a3a32;--ink:#3e2a18}
*{box-sizing:border-box;min-width:0}
body{margin:0;font:15px/1.5 Jost,system-ui,sans-serif;background:#f4ead6;color:var(--ink)}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px max(3vw,12px);background:var(--em);color:#f6e6bb}
header b{font-family:'Playfair Display',Georgia,serif;font-size:24px;letter-spacing:.08em;color:var(--g)}
nav{display:flex;flex-wrap:wrap;gap:6px;flex:1}
nav button{min-height:38px;padding:0 12px;border:1px solid rgba(230,194,119,.4);border-radius:999px;background:none;color:#f6e6bb;font:inherit;font-size:13px;position:relative}
nav button.on{background:var(--g);color:#2b1a0b}
nav button i{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#c62828;color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;padding:0 4px}
main{max-width:1200px;margin:0 auto;padding:20px max(3vw,12px) 60px}
h2{font-family:'Playfair Display',Georgia,serif;margin:0 0 14px}
.card{background:#fffaf0;border:1px solid #e3d0a8;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(90,60,25,.06)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.muted{color:#7a5a38;font-size:13px}
.btn{min-height:38px;padding:0 14px;border:1px solid #cfae73;border-radius:999px;background:#f3e6c9;color:#4a2f1a;font:inherit;font-size:13px;cursor:pointer}
.btn.pri{background:var(--em);color:#f6e6bb;border-color:var(--em)}
.btn.red{background:#fbe3e3;border-color:#e57373;color:#8e1c1c}
.btn.on{background:#4a2f1a;color:#f6e6bb}
input,select,textarea{width:100%;min-height:40px;padding:8px 12px;border:1px solid #cfae73;border-radius:10px;background:#fff;font:inherit;font-size:15px;color:var(--ink)}
textarea{min-height:70px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:#eee}
.st.new{background:#fde4c8}.st.accepted{background:#e0ecff}.st.on_way{background:#e8defc}.st.delivered{background:#d9f2e2}.st.cancelled{background:#f6d6d6}
.lines{margin:8px 0;padding-left:18px}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#eee}
.login{max-width:380px;margin:12vh auto;text-align:center}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:20;padding:10px 18px;border-radius:999px;background:var(--em);color:#f6e6bb}
.toast.err{background:#8e1c1c}
.msgs{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0}
.m{max-width:80%;padding:6px 12px;border-radius:12px;background:#fff;border:1px solid #e6d8bd;font-size:14px}
.m.a{align-self:flex-end;background:var(--em);color:#f6e6bb}
.demo{padding:10px 14px;border-radius:12px;background:#fde4ea;color:#8e2445;margin-bottom:14px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid #eadcbf;text-align:left}
td.n{text-align:right;white-space:nowrap}

/* order photos + QR sticker */
.ophotos{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.ophotos span{position:relative}
.ophotos img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid #e5d7bd;display:block}
.ophotos span button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#b3261e;color:#fff;font-size:13px;line-height:1;cursor:pointer}
#printArea{position:fixed;inset:0;z-index:99;background:#fff;overflow:auto;padding:20px}
#printArea .pa-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#printArea .pa-hint{word-break:break-all}
.pa-sheet{display:grid;grid-template-columns:repeat(auto-fill,60mm);gap:8mm;margin-top:14px}
.stk{width:60mm;height:80mm;box-sizing:border-box;border:1px dashed #c9a96a;border-radius:6mm;padding:5mm;text-align:center;font-family:Georgia,serif;color:#3b2414;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:#fffaf2}
.stk-b{font-size:15pt;letter-spacing:.04em}
.stk-q{width:40mm;height:40mm}.stk-q svg{width:100%;height:100%}
.stk-t{font-size:11pt;font-weight:bold;text-transform:uppercase;letter-spacing:.08em;color:#9c7128}
.stk-s{font:8pt system-ui,sans-serif;color:#6b5440}
.stk-n{font:8pt system-ui,sans-serif;color:#9a8a78}
@media print{body>*:not(#printArea){display:none!important}#printArea{position:static;padding:0}.pa-bar,.pa-hint{display:none}.stk{border-style:solid}}
</style>
</head>
<body>
<div id="app"></div>
<script src="js/logic.js"></script>
<script src="js/api.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
